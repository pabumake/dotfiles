<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c101d"/>
      <stop offset="0.52" stop-color="#111625"/>
      <stop offset="1" stop-color="#171526"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="14%" r="72%">
      <stop offset="0" stop-color="#a6e3a1" stop-opacity="0.15"/>
      <stop offset="0.52" stop-color="#94e2d5" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdd6f4"/>
      <stop offset="0.5" stop-color="#a6e3a1"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#050713" flood-opacity="0.8"/>
    </filter>
    <style>
      .title { font-family: "Helvetica Neue", sans-serif; font-size: 132px; font-weight: 300; letter-spacing: 14px; fill: url(#title); text-anchor: middle; }
      .subtitle { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 46px; font-weight: 600; letter-spacing: 10px; fill: #cdd6f4; text-anchor: middle; }
      .section { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 25px; font-weight: 700; letter-spacing: 5px; fill: #a6e3a1; }
      .action { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 24px; font-weight: 400; fill: #cdd6f4; }
      .action-small { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 21px; font-weight: 400; fill: #cdd6f4; }
      .muted { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 22px; font-weight: 400; fill: #7f849c; }
      .keytext { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 27px; font-weight: 500; fill: #e5e9ff; text-anchor: middle; dominant-baseline: middle; }
      .keytext-small { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 22px; font-weight: 500; fill: #e5e9ff; text-anchor: middle; dominant-baseline: middle; }
      .key { fill: #25283a; fill-opacity: 0.9; stroke: #a6e3a1; stroke-width: 2.5; }
      .divider { stroke: #45475a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>
  <rect width="1024" height="1536" fill="url(#glow)"/>
  <rect x="25" y="25" width="974" height="1486" rx="42" fill="none" stroke="#a6e3a1" stroke-width="3"/>

  <text x="512" y="187" class="title">HERDR</text>
  <text x="512" y="266" class="subtitle">TERMINAL</text>

  <text x="72" y="350" class="section">PREFIX TRANSLATED</text>
  <line x1="72" y1="370" x2="952" y2="370" class="divider"/>

  <text x="72" y="405" class="action-small">Press CONTROL + B, release, then press the command key</text>

  <g filter="url(#shadow)">
    <rect x="72" y="445" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="477" class="keytext">⌃</text>
    <rect x="144" y="445" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="477" class="keytext">B</text>
    <text x="223" y="485" class="action">→</text>
    <rect x="270" y="445" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="477" class="keytext">V</text>
  </g>
  <text x="570" y="487" class="action">Vertical pane split</text>

  <g filter="url(#shadow)">
    <rect x="72" y="535" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="567" class="keytext">⌃</text>
    <rect x="144" y="535" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="567" class="keytext">B</text>
    <text x="223" y="575" class="action">→</text>
    <rect x="270" y="535" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="567" class="keytext">-</text>
  </g>
  <text x="570" y="577" class="action">Horizontal pane split</text>

  <g filter="url(#shadow)">
    <rect x="72" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="657" class="keytext">⌃</text>
    <rect x="144" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="657" class="keytext">B</text>
    <text x="223" y="665" class="action">→</text>
    <rect x="270" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="657" class="keytext">H</text>
    <rect x="342" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="373" y="657" class="keytext">J</text>
    <rect x="414" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="445" y="657" class="keytext">K</text>
    <rect x="486" y="625" width="62" height="62" rx="10" class="key"/>
    <text x="517" y="657" class="keytext">L</text>
  </g>
  <text x="610" y="667" class="action-small">Focus left / down / up / right</text>

  <g filter="url(#shadow)">
    <rect x="72" y="715" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="747" class="keytext">⌃</text>
    <rect x="144" y="715" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="747" class="keytext">B</text>
    <text x="223" y="755" class="action">→</text>
    <rect x="270" y="715" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="747" class="keytext">⇧</text>
    <rect x="342" y="715" width="62" height="62" rx="10" class="key"/>
    <text x="373" y="747" class="keytext">N</text>
  </g>
  <text x="570" y="757" class="action">New workspace</text>

  <g filter="url(#shadow)">
    <rect x="72" y="805" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="837" class="keytext">⌃</text>
    <rect x="144" y="805" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="837" class="keytext">B</text>
    <text x="223" y="845" class="action">→</text>
    <rect x="270" y="805" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="837" class="keytext">W</text>
  </g>
  <text x="570" y="847" class="action">Workspace picker</text>

  <g filter="url(#shadow)">
    <rect x="72" y="895" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="927" class="keytext">⌃</text>
    <rect x="144" y="895" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="927" class="keytext">B</text>
    <text x="223" y="935" class="action">→</text>
    <rect x="270" y="895" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="927" class="keytext">C</text>
  </g>
  <text x="570" y="937" class="action">New tab</text>

  <g filter="url(#shadow)">
    <rect x="72" y="985" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="1017" class="keytext">⌃</text>
    <rect x="144" y="985" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="1017" class="keytext">B</text>
    <text x="223" y="1025" class="action">→</text>
    <rect x="270" y="985" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="1017" class="keytext">P</text>
    <text x="349" y="1025" class="action">/</text>
    <rect x="384" y="985" width="62" height="62" rx="10" class="key"/>
    <text x="415" y="1017" class="keytext">N</text>
  </g>
  <text x="570" y="1027" class="action">Previous / next tab</text>

  <g filter="url(#shadow)">
    <rect x="72" y="1075" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="1107" class="keytext">⌃</text>
    <rect x="144" y="1075" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="1107" class="keytext">B</text>
    <text x="223" y="1115" class="action">→</text>
    <rect x="270" y="1075" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="1107" class="keytext">Z</text>
  </g>
  <text x="570" y="1117" class="action">Toggle pane zoom</text>

  <g filter="url(#shadow)">
    <rect x="72" y="1165" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="1197" class="keytext">⌃</text>
    <rect x="144" y="1165" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="1197" class="keytext">B</text>
    <text x="223" y="1205" class="action">→</text>
    <rect x="270" y="1165" width="62" height="62" rx="10" class="key"/>
    <text x="301" y="1197" class="keytext">X</text>
  </g>
  <text x="570" y="1207" class="action">Close pane</text>

  <text x="72" y="1435" class="muted">⌃  Control     ⇧  Shift</text>
</svg>
