<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c101d"/>
      <stop offset="0.52" stop-color="#111625"/>
      <stop offset="1" stop-color="#171526"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="14%" r="72%">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.15"/>
      <stop offset="0.52" stop-color="#f5c2e7" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdd6f4"/>
      <stop offset="0.5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#050713" flood-opacity="0.8"/>
    </filter>
    <style>
      .title { font-family: "Helvetica Neue", sans-serif; font-size: 108px; font-weight: 300; letter-spacing: 9px; fill: url(#title); text-anchor: middle; }
      .subtitle { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 46px; font-weight: 600; letter-spacing: 10px; fill: #cdd6f4; text-anchor: middle; }
      .section { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 25px; font-weight: 700; letter-spacing: 5px; fill: #cba6f7; }
      .action { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 24px; font-weight: 400; fill: #cdd6f4; }
      .action-small { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 21px; font-weight: 400; fill: #cdd6f4; }
      .muted { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 22px; font-weight: 400; fill: #7f849c; }
      .keytext { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 27px; font-weight: 500; fill: #e5e9ff; text-anchor: middle; dominant-baseline: middle; }
      .keytext-small { font-family: "JetBrainsMono Nerd Font Mono", monospace; font-size: 22px; font-weight: 500; fill: #e5e9ff; text-anchor: middle; dominant-baseline: middle; }
      .key { fill: #25283a; fill-opacity: 0.9; stroke: #cba6f7; stroke-width: 2.5; }
      .divider { stroke: #45475a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>
  <rect width="1024" height="1536" fill="url(#glow)"/>
  <rect x="25" y="25" width="974" height="1486" rx="42" fill="none" stroke="#cba6f7" stroke-width="3"/>

  <text x="512" y="187" class="title">AEROSPACE</text>
  <text x="512" y="266" class="subtitle">WORKSPACES</text>

  <text x="72" y="350" class="section">WORKSPACE CONTROL</text>
  <line x1="72" y1="370" x2="952" y2="370" class="divider"/>

  <g filter="url(#shadow)">
    <rect x="72" y="405" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="437" class="keytext">⌥</text>
    <rect x="144" y="405" width="98" height="62" rx="10" class="key"/>
    <text x="193" y="437" class="keytext">1–9</text>
  </g>
  <text x="465" y="447" class="action">Switch workspace</text>

  <g filter="url(#shadow)">
    <rect x="72" y="505" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="537" class="keytext">⌥</text>
    <rect x="144" y="505" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="537" class="keytext">⇧</text>
    <rect x="216" y="505" width="98" height="62" rx="10" class="key"/>
    <text x="265" y="537" class="keytext">1–9</text>
  </g>
  <text x="465" y="547" class="action">Send window to workspace</text>

  <g filter="url(#shadow)">
    <rect x="72" y="605" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="637" class="keytext">⌥</text>
    <rect x="144" y="605" width="104" height="62" rx="10" class="key"/>
    <text x="196" y="637" class="keytext">TAB</text>
  </g>
  <text x="465" y="647" class="action">Next workspace</text>

  <g filter="url(#shadow)">
    <rect x="72" y="705" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="737" class="keytext">⌥</text>
    <rect x="144" y="705" width="62" height="62" rx="10" class="key"/>
    <text x="175" y="737" class="keytext">⇧</text>
    <rect x="216" y="705" width="104" height="62" rx="10" class="key"/>
    <text x="268" y="737" class="keytext">TAB</text>
  </g>
  <text x="465" y="747" class="action">Previous workspace</text>

  <g filter="url(#shadow)">
    <rect x="72" y="805" width="370" height="62" rx="10" class="key"/>
    <text x="257" y="837" class="keytext-small">3-FINGER HORIZONTAL</text>
  </g>
  <text x="465" y="847" class="action-small">Previous / next occupied</text>

  <g filter="url(#shadow)">
    <rect x="72" y="905" width="62" height="62" rx="10" class="key"/>
    <text x="103" y="937" class="keytext">⌥</text>
    <rect x="144" y="905" width="118" height="62" rx="10" class="key"/>
    <text x="203" y="937" class="keytext">CTRL</text>
    <rect x="272" y="905" width="62" height="62" rx="10" class="key"/>
    <text x="303" y="937" class="keytext">⇧</text>
    <rect x="344" y="905" width="118" height="62" rx="10" class="key"/>
    <text x="403" y="937" class="keytext">←↓↑→</text>
  </g>
  <text x="485" y="947" class="action-small">Move workspace by monitor</text>

  <text x="72" y="1055" class="section">PERSONAL PROFILE</text>
  <line x1="72" y1="1075" x2="952" y2="1075" class="divider"/>

  <text x="72" y="1125" class="action">1  Ghostty    ·    2  VSCodium    ·    3  Zen</text>

  <text x="72" y="1435" class="muted">⌥ Option   CTRL Control   ⇧ Shift</text>
</svg>
