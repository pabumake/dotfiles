# Paths can be absolute or start with ~/.
SOURCE_ROOT=~/src/archive
TARGET_ROOT=/Volumes/datastore0/project-archive
TARGET_MOUNT_ROOT=/Volumes/datastore0

# Use modern Homebrew rsync explicitly. /usr/bin/rsync is the older Apple build.
RSYNC_BIN=/opt/homebrew/bin/rsync

# A repository needs at least one remote URL containing one of these markers.
ALLOWED_REMOTE_MARKERS=github.com,git.cloud.pbmk.net

# Keep at least 5 GiB free on the NAS target and require its mounted volume.
MIN_FREE_BYTES=5368709120
REQUIRE_MOUNT=1
